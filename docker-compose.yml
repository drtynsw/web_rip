services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: attack_vectors_user
      POSTGRES_PASSWORD: attack_vectors_pass
      POSTGRES_DB: attack_vectors_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
